<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HaulLit</title>

  <!-- Tipografía: Syne (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <!-- AOS — animaciones al hacer scroll -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header__logo">
            <a href="index.html" class="header__logo-link">
                <img src="img/logo-haullit-monogram-transparent.svg" alt="HaulLit" class="header__logo-img">
                <div class="header__naming">
                    <span class="header__brand">HAULIT</span>
                    <span class="header__tagline">STREETWEAR</span>
                </div>
             </a>
        </div>

    <nav class="header__nav">
      <a href="catalogo.html" class="nav__link">CATÁLOGO</a>
      <a href="cuenta.html"   class="nav__link">MI CUENTA</a>
      <a href="info.html"     class="nav__link">INFO</a>
      <a href="peticiones.html" class="nav__link">PETICIONES</a>
    </nav>

    <button class="header__cart-btn" id="js-cart-toggle" aria-label="Abrir carrito">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <span>CARRITO</span>
      <span class="cart-badge" id="js-cart-count">0</span>
    </button>
  </header>

  <!-- LAYOUT PRINCIPAL -->
  <div class="layout">

    <main class="main" id="js-main">

      <!-- HERO -->
      <section class="hero">
        <div class="hero__content">
          <span class="hero__tag" data-aos="fade-up" data-aos-delay="0">NUEVA COLECCIÓN — Mayo 2026</span>
          <h1 class="hero__title" data-aos="fade-up" data-aos-delay="100">Lo quieres.<br>Lo tienes.</h1>
          <a href="catalogo.html" class="hero__cta" data-aos="fade-up" data-aos-delay="200">VER CATÁLOGO</a>
        </div>
      </section>

      <!-- PRODUCTOS DESTACADOS -->
      <section class="products">
        <div class="products__header" data-aos="fade-up">
          <h2 class="products__title">DESTACADOS</h2>
        </div>
        <div class="products__grid" id="js-products-grid" data-aos="fade-up" data-aos-delay="100">
          <!--productos-->
        </div>
      </section>

    </main>

    <!-- CARRITO LATERAL -->
    <aside class="cart" id="js-cart">
      <div class="cart__header">
        <span class="cart__title">CARRITO</span>
        <span class="cart__count" id="js-cart-label">0 artículos</span>
      </div>

      <div class="cart__items" id="js-cart-items">
        <div class="cart__empty" id="js-cart-empty">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <p>Tu carrito está vacío</p>
        </div>
      </div>

      <div class="cart__footer" id="js-cart-footer">
        <div class="cart__subtotal">
          <span class="cart__subtotal-label">SUBTOTAL</span>
          <span class="cart__subtotal-value" id="js-subtotal">0,00 €</span>
        </div>
        <a href="checkout.html" class="cart__checkout-btn">FINALIZAR COMPRA</a>
      </div>
    </aside>

  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <span class="footer__copy">© 2025 HAULIT</span>
    <nav class="footer__links">
      <a href="info.html">CONTACTO</a>
      <a href="info.html#redes">REDES</a>
      <a href="info.html#soporte">SOPORTE</a>
    </nav>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>

  <!-- AOS init -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 500,
      once: true,
      offset: 40,
      easing: 'ease-out'
    });
  </script>
</body>
</html>
