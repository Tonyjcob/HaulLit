<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HaulLit</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
<body>

    <!--HEADER-->
<header class="header">
    <div class="header__logo">
        <span class="header__brand">HAULIT</span>
        <span class="header__tagline">STREETWEAR</span>
    </div>

    <nav class="header__nav">
        <a href="catalogo.html" class="nav__link">CATÁLOGO</a>
        <a href="cuenta.html" class="nav__link">MI CUENTA</a>
        <a href="info.html" class="nav__link">INFO</a>
        <a href="peticiones.html" class="nav__link">PETICIONES</a>
    </nav>

    <button class="header__cart-btn" id="js-cart-toggle" aria-label="Abrir carrito">
        <svg width="18" height="18" viewBox="0 0 24 24"fill="none" 
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
             <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
             <line x1="3" y1="6" x2="21" y2="6"/>
             <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
      <span>CARRITO</span>
      <span class="cart-badge" id="js-cart-count">0</span>
    </button>
</header>

<!-- LAYOUT PRINCIPAL-->
 <div class="layout">

    <main class="main" id="js-main">

        <!--Hero-->
        <section class="hero">
            <div class="hero__content">
                <span class="hero__tag">NUEVOS PRODUCTO - 2026</span>
                <h1 class="hero__title">Lo quieres.<br>Lo tienes.</h1>
                <a href="catalogo.html" class="hero__cta">VER CATALOGO</a>
            </div>
        </section>
        
        <!--Productos Destacados-->
        <section class="products">
            <div class="products__header">
                <h2 class="products_title">DESTACADOS</h2>
            </div>
            <div class="products__grid" id="js-products-grid">
                <p class="products__empty">Próximamente...</p>
            </div>
        </section>

    </main>

    <!--Carrito lateral-->
    <aside class="cart" id="js-cart">
        <div class="cart_header">
            <span class="cart__title">CARRITO</span>
            <span class="cart__count" id="js-cart-lable">0 artículos</span>
        </div>

        <div class="cart__item" id="js-cart-item">
            <div class="cart__empty" id="js-cart-empty">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
                  <line x1="3" y1="6" x2="21" y2="6"/>
                  <path d="M16 10a4 4 0 01-8 0"/>
                </svg>
                <p>Tu carrito está vacío</p>
            </div>
        </div>

        <div class="cart__footer">
            <div class="cart__subtotal">
                <span class="cart__subtotal-label">SUBTOTAL</span>
                <span class="cart__subtotal-value" id="js-subtotal">0,00 €</span>
            </div>
            <a href="checkout.html" class="cart__checkout-btn">FINALIZAR COMPRA</a>
        </div>
    </aside>

 </div>

 <!--footer-->
 <footer class="footer">
    <span class="footer__copy">© 2026 HAULIT</span>
    <nav class="footer__links">
        <a href="info.html">CONTACTO</a>
        <a href="info.html#redes">REDES</a>
        <a href="info.html#soporte">SOPORTE</a>
    </nav>
 </footer>

<script src="js/cart.js"></script>
</body>    
</html>
