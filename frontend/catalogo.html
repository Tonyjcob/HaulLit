<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo - HaulLit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/catalogo.css" />
</head>
<body>

    <!--HEADER-->
    <header class="header">
        <div class="header__logo">
            <a href="index.html"><span class="header__brand">HAULIT</span></a>
            <span class="header__tagline">STREETWEAR</span>
        </div>
        <nav class="header__nav">
           <a href="catalogo.html" class="nav__link active">CATÁLOGO</a>
           <a href="cuenta.html"   class="nav__link">MI CUENTA</a>
           <a href="info.html"     class="nav__link">INFO</a>
           <a href="peticiones.html" class="nav__link">PETICIONES</a> 
        </nav>
        <button class="header__cart-btn" id="js-cart-toggle" aria-label="Abrir carrito">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
            <span>CARRITO</span>
            <span class="cart-badge" id="js-cart-count">0</span>
        </button>
    </header>

<!--LAYOUT-->
<div class="layout">
    <main class="main">

        <!--CABECERA CATÁLOGO-->
        <div class="catalog__header">
          <div class="catalog__title-row">
            <h1 class="catalog__title">CATÁLOGO</h1>
            <span class="catalog__count" id="js-catalog-count">8 productos</span>
        </div>

        <!--FILTROS-->
        <div class="catalogos__filters">
            <div class="filters__group">
                <span class="filters__label">CATEGORÍA</span>
                <div class="filters__pills" id="js-filter-category">
                    <button class="filter-pill active" data-filter="category" data-value="all">TODOS</button>
                    <button class="filter-pill" data-filter="category" data-value="camisetas">CAMISETAS</button>
                    <button class="filter-pill" data-filter="category" data-value="sudaderas">SUDADERAS</button>
                    <button class="filter-pill" data-filter="category" data-value="pantalones">PANTALONES</button>
                    <button class="filter-pill" data-filter="category" data-value="chaquetas">CHAQUETAS</button>   
                </div>
            </div>

           <div class="filters__group">
            <span class="filters__label">ORDENAR</span>
            <div class="filters__pills">
              <button class="filter-pill active" data-sort="default">DESTACADOS</button>
              <button class="filter-pill" data-sort="price-asc">PRECIO ↑</button>
              <button class="filter-pill" data-sort="price-desc">PRECIO ↓</button>
            </div>
          </div>
        </div>
      </div>    

      <!--Grid Productos-->
      <div class="catalog__grid" id="js-catalog-grid">
            <!--Generado por js/catalogo.js-->
      </div>

    </main>

    <!--Carrito lateral-->
    <aside class="cart" id="js-cart">
        <div class="cart__header">
            <span class="cart_title">CARRITO</span>
            <span class="cart__count" id="js-cart-label">0 artículos</span>
        </div>
        <div class="cart__items" id="js-cart-items">
            <div class="cart__empty">
                <svg width="32" height="32"viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <path d="M16 10a4 4 0 01-8 0"/>
                </svg> 
                <p>Tu carrito está vacío</p>
            </div>
        </div>
        <div class="cart__footer">
            <div class="cart__subtotal">
                <span class="cart__subtotal-label">SUBTOTAL</span>
                <span class="cart__subtotal-value" id="js-subtotal">0,00 €</span>
             </div>
             <a href="checkout.html" class="cart__checkout-btn">FINALIZAR COMPRA</a>
        </div>
    </aside>

</div>

 <!-- FOOTER -->
  <footer class="footer">
    <span class="footer__copy">© 2025 HAULIT</span>
    <nav class="footer__links">
      <a href="info.html">CONTACTO</a>
      <a href="info.html#redes">REDES</a>
      <a href="info.html#soporte">SOPORTE</a>
    </nav>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init({ duration: 500, once: true, offset: 40, easing: 'ease-out' });</script>
</body>
</html>
