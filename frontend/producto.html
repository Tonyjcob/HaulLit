<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producto — HaulLit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/producto.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header__logo">
            <a href="index.html" class="header__logo-link">
                <img src="img/logo-haullit-monogram-transparent.svg" alt="HaulLit" class="header__logo-img">
                <div class="header__naming">
                    <span class="header__brand">HAULIT</span>
                    <span class="header__tagline">STREETWEAR</span>
                </div>
             </a>
        </div>
    <nav class="header__nav">
      <a href="catalogo.html" class="nav__link active">CATÁLOGO</a>
      <a href="cuenta.html"   class="nav__link">MI CUENTA</a>
      <a href="info.html"     class="nav__link">INFO</a>
      <a href="peticiones.html" class="nav__link">PETICIONES</a>
    </nav>
    <button class="header__cart-btn" id="js-cart-toggle" aria-label="Abrir carrito">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <span>CARRITO</span>
      <span class="cart-badge" id="js-cart-count">0</span>
    </button>
  </header>

  <!-- LAYOUT -->
  <div class="layout">
    <main class="main">

      <!-- BREADCRUMB -->
      <div class="product__breadcrumb">
        <a href="catalogo.html">CATÁLOGO</a>
        <span>/</span>
        <span id="js-breadcrumb-category">—</span>
        <span>/</span>
        <span id="js-breadcrumb-name">—</span>
      </div>

      <!-- FICHA PRINCIPAL -->
      <div class="product__layout">

        <!-- GALERÍA -->
        <div class="product__gallery" data-aos="fade-up">
          <div class="gallery__main" id="js-gallery-main">
            <div class="product-card__placeholder">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.57
                         a1 1 0 00.99.84H5v10a1 1 0 001 1h12a1 1 0 001-1V10h1.15a1 1 0 00.99-.84
                         l.58-3.57a2 2 0 00-1.34-2.23z"/>
              </svg>
              <span>FOTO PRÓXIMAMENTE</span>
            </div>
          </div>
          <div class="gallery__thumbs" id="js-gallery-thumbs"></div>
        </div>

        <!-- INFO -->
        <div class="product__info" data-aos="fade-up" data-aos-delay="100">
          <div class="product__meta">
            <h1 class="product__name" id="js-product-name">—</h1>
            <span class="product__price" id="js-product-price">—</span>
          </div>

          <hr class="product__divider">

          <div class="product__selector">
            <span class="selector__label">COLOR — <span id="js-color-name">—</span></span>
            <div class="selector__colors" id="js-colors"></div>
          </div>

          <div class="product__selector">
            <span class="selector__label">TALLA</span>
            <div class="selector__sizes" id="js-sizes"></div>
          </div>

          <button class="product__add-btn" id="js-add-btn">AÑADIR AL CARRITO</button>
          <p class="product__add-error" id="js-add-error"></p>

          <hr class="product__divider">

          <p class="product__desc" id="js-product-desc">—</p>
        </div>
      </div>

      <!-- PRODUCTOS SIMILARES -->
      <div class="product__similares">
        <h2 class="similares__title">PRODUCTOS SIMILARES</h2>
        <div class="similares__grid" id="js-similares-grid"></div>
      </div>

    </main>

    <!-- CARRITO LATERAL -->
    <aside class="cart" id="js-cart">
      <div class="cart__header">
        <span class="cart__title">CARRITO</span>
        <span class="cart__count" id="js-cart-label">0 artículos</span>
      </div>
      <div class="cart__items" id="js-cart-items">
        <div class="cart__empty">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <p>Tu carrito está vacío</p>
        </div>
      </div>
      <div class="cart__footer">
        <div class="cart__subtotal">
          <span class="cart__subtotal-label">SUBTOTAL</span>
          <span class="cart__subtotal-value" id="js-subtotal">0,00 €</span>
        </div>
        <a href="checkout.html" class="cart__checkout-btn">FINALIZAR COMPRA</a>
      </div>
    </aside>

  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <span class="footer__copy">© 2025 HAULIT</span>
    <nav class="footer__links">
      <a href="info.html">CONTACTO</a>
      <a href="info.html#redes">REDES</a>
      <a href="info.html#soporte">SOPORTE</a>
    </nav>
  </footer>

<!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>

  <!-- Scripts propios -->
  <script src="js/cart.js"></script>
  <script src="js/catalogo.js"></script>

  <!-- AOS -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init({ duration: 500, once: true, offset: 40, easing: 'ease-out' });</script>
</body>
</html>
